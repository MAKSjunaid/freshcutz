# ---- Backup e-mail (Excel file of all data, sent through Resend) ----------
# OFF until you set RESEND_API_KEY and BACKUP_EMAIL_TO (on Render -> Environment).
#   RESEND_API_KEY        your Resend API key (starts with re_) -- keep it ONLY in Render, never in this file
#   BACKUP_EMAIL_TO       where the backup goes (the e-mail you signed up to Resend with)
#   BACKUP_INTERVAL_HOURS optional; leave 0. Automatic sending is OFF by default; switch it on (and pick
#                         Send / Data to include) in Admin -> Customize -> Email backup
#   BACKUP_FROM           optional; leave unset to use onboarding@resend.dev
# While idle this costs nothing: it is only a memory check every 10 minutes (no database).
freshcutz.backup.resend-api-key=${RESEND_API_KEY:}
freshcutz.backup.to=${BACKUP_EMAIL_TO:}
freshcutz.backup.from=${BACKUP_FROM:FreshCutz Backup <onboarding@resend.dev>}
freshcutz.backup.interval-hours=${BACKUP_INTERVAL_HOURS:0}
