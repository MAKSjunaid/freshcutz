# ===================================================================
# FreshCutz backend configuration
# All values can be overridden with environment variables (recommended
# for real deployments) without touching this file. See README.md.
# ===================================================================

server.port=${PORT:8080}
spring.application.name=freshcutz-backend

# ---- Database -----------------------------------------------------
# Set to your Neon project directly (see below) so the app talks to Neon
# by default, with no env vars needed for local runs either. You can
# still override any of these four with an env var of the same name â
# that's what Render will do, and how you'd point this at a different
# database later without editing this file.
#
# NOTE: this means your real Neon password is sitting in this file, which
# will be pushed to GitHub. Keeping the repo Private (as planned) keeps it
# reasonably safe, but the sturdier long-term approach is to move these
# three values (url/username/password) OUT of this file and into env vars
# only (locally: set them in your terminal before `mvn spring-boot:run`;
# on Render: already handled by render.yaml). Swap back to that whenever
# you're ready â just change the defaults below back to sa/h2, the same
# way they were before.
# prepareThreshold=0&preparedStatementCacheQueries=0: Neon's pooler endpoint
# (the "-pooler" hostname above) is PgBouncer running in TRANSACTION mode,
# which hands out a different real Postgres backend connection per
# transaction. Standard JDBC server-side prepared statements are tied to
# one specific backend connection, so without this setting, pgjdbc's
# default behaviour (switch to a server-side prepared statement after 5
# uses of the same query) intermittently lands on a backend that doesn't
# have that statement, forcing a silent retry as a fresh query -- a full
# extra network round trip to Neon (~200ms from India to Virginia), which
# is exactly the ~220ms vs ~440ms bimodal pattern seen in the Orders tab
# timing log. This disables server-side prepared statements entirely so
# every query always takes the same, single-round-trip path. Keep this if
# you ever add a direct (non-pooler) Neon connection string too, since it's
# harmless there -- it just gives up a small, unneeded optimization.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-leaf-avy3s0eb-pooler.c-11.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require&prepareThreshold=0&preparedStatementCacheQueries=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_fLX0WiC5ZtcB}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ---- Connection pool (HikariCP) ---------------------------------------
# Neon's free-tier compute auto-suspends after 5 minutes with no active
# queries, and the pooler can drop an idle client connection sooner than
# that too. Left on HikariCP's defaults, two problems show up:
#   1) keepalive-time defaults to 0 (off), so HikariCP never proactively
#      checks on an idle pooled connection. The first request after any
#      gap then has to find out the hard way -- either a slow reconnect
#      (if Neon already closed it) or, every single time a connection sat
#      idle 500ms+ (HikariCP's built-in aliveBypassWindowMs), a synchronous
#      validation ping before your query even runs. That ping is a real
#      round trip to Neon's Virginia region -- on top of the query's own
#      round trip -- and it happens before OrderService's dbCallMs timer
#      even starts, which is exactly the gap between the ~220-250ms
#      dbCallMs the backend logs and the ~720ms "Waiting for server
#      response" Chrome's Network tab showed for the same request.
#      keepalive-time below runs that same ping on a background thread on
#      a timer instead, so it's already fresh by the time a real request
#      needs the connection, instead of happening on the request's own time.
#   2) max-lifetime defaults to 30 minutes, far longer than Neon's 5-minute
#      suspend window, so a connection can go stale and only be discovered
#      (then slowly replaced) when a real request hits it -- the
#      "Failed to validate connection ... connection has been closed"
#      warnings, and the one 10-second request that came with them.
#      Setting it comfortably under 5 minutes means HikariCP retires and
#      replaces connections on its own schedule, off the request path.
#
# Pool size is also dropped from Hikari's default of 10 to 5 -- this is a
# single-admin panel, not a high-concurrency API, so 10 idle connections
# just means 10 connections' worth of background keepalive pings for no
# real benefit.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=240000

# ---- Admin login ----------------------------------------------------
# CHANGE THESE before you share the site with anyone. You can either
# edit the values here or set ADMIN_USERNAME / ADMIN_PASSWORD env vars.
freshcutz.admin.username=${ADMIN_USERNAME:admin}
freshcutz.admin.password=${ADMIN_PASSWORD:FreshCutz@2026}
freshcutz.admin.token-ttl-hours=${ADMIN_TOKEN_TTL_HOURS:12}

# ---- Product photos ---------------------------------------------------
# Photos are stored directly in the database (Product.imageData), not as
# files on disk â that's what makes them survive a redeploy on a free host
# like Render, whose disk isn't persistent. freshcutz.uploads.dir is only
# used by ImageMigrationRunner, to find OLD disk-stored photos the very
# first time it runs against a database from before this change.
# 2MB/photo keeps a typical product catalog comfortably inside Neon's free
# 500MB â lower this further, or compress photos before uploading, if
# you're adding a lot of products.
freshcutz.uploads.dir=${UPLOADS_DIR:./uploads/products}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---- CORS ------------------------------------------------------------
# Comma separated list of origins allowed to call this API. "*" allows
# any origin, which is fine if the frontend has no login of its own
# (only the admin API is protected, and that uses a token, not cookies).
freshcutz.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

