<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1a15"/>
      <stop offset="100%" stop-color="#302a1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a13b"/>
      <stop offset="50%" stop-color="#f0d98a"/>
      <stop offset="100%" stop-color="#c9a13b"/>
    </linearGradient>
    <linearGradient id="meat" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f6ddc6"/>
      <stop offset="45%" stop-color="#eab98f"/>
      <stop offset="100%" stop-color="#d99a71"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a35"/>
      <stop offset="100%" stop-color="#6b4325"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- cutting board -->
  <ellipse cx="200" cy="248" rx="128" ry="26" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="200" cy="238" rx="126" ry="22" fill="url(#board)"/>
  <ellipse cx="200" cy="234" rx="118" ry="16" fill="#9c6a3f" opacity="0.6"/>

  <!-- herb sprig -->
  <g transform="translate(96,150) rotate(-18)" opacity="0.92">
    <path d="M0,40 Q4,10 0,0" stroke="#5c8a52" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="-6" cy="10" rx="7" ry="3.4" fill="#6fa661" transform="rotate(-35 -6 10)"/>
    <ellipse cx="7" cy="6" rx="7" ry="3.4" fill="#7fb571" transform="rotate(30 7 6)"/>
    <ellipse cx="-5" cy="22" rx="7" ry="3.4" fill="#6fa661" transform="rotate(-30 -5 22)"/>
    <ellipse cx="6" cy="26" rx="7" ry="3.4" fill="#7fb571" transform="rotate(25 6 26)"/>
  </g>

  <!-- chicken cut piece -->
  <g transform="translate(200,168)">
    <ellipse cx="4" cy="18" rx="76" ry="58" fill="#000" opacity="0.18" filter="url(#soft)"/>
    <path d="M-64,-14 C-70,-48 -34,-70 -6,-56 C16,-70 54,-58 58,-24 C82,-14 84,20 56,34
             C60,62 26,80 -2,68 C-30,82 -66,66 -62,36 C-88,24 -86,-6 -64,-14 Z"
          fill="url(#meat)"/>
    <ellipse cx="-18" cy="-16" rx="40" ry="24" fill="url(#gloss)"/>
    <path d="M-40,10 Q-10,26 22,8" stroke="#c97f52" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M-30,32 Q0,46 30,30" stroke="#c97f52" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- sparkle accent -->
  <g transform="translate(336,72)" fill="#fff" opacity="0.9">
    <path d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z"/>
  </g>

  <text x="200" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700"
        fill="url(#gold)" text-anchor="middle" letter-spacing="2">FRESHCUTZ</text>
  <text x="200" y="324" font-family="Arial, sans-serif" font-size="12.5" fill="#c9b37a" text-anchor="middle"
        letter-spacing="0.5">Freshly Cut. Naturally Juicy.</text>
  <text x="200" y="358" font-family="Arial, sans-serif" font-size="12" fill="#8a8172" text-anchor="middle">
    Real photo coming soon — add one from Admin
  </text>
</svg>
